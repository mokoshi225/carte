async function registerReading() {
  const date = $('inp-date').value;
  const sbp = Number($('inp-sbp').value);
  const dbp = Number($('inp-dbp').value);
  const memo = $('inp-memo').value.trim();
  if (!date || !sbp || !dbp) { toast('日付・収縮期・拡張期は必須です'); return; }
  if (sbp < 50 || sbp > 300 || dbp < 30 || dbp > 200) { toast('血圧値の範囲が不正です'); return; }

  const existing = await getReadingByDate(currentPatientId, date);
  if (existing && existing.id !== editingId) {
    if (!confirm('上書き確認', `${date} のデータは既に存在します。上書きしますか？`, async () => {
      existing.systolic = sbp; existing.diastolic = dbp;
      existing.meanArterial = Math.round((sbp + dbp * 2) / 3);
      existing.memo = memo; existing.updatedAt = new Date().toISOString();
      await putReading(existing);
      toast(`${date} のデータを更新しました`);
      renderPatientPage();
      setTimeout(() => { $('inp-sbp').value = ''; $('inp-dbp').value = ''; $('inp-memo').value = ''; $('inp-sbp').focus(); }, 100);
    })) return;
    return;
  }

  // Merge with existing if same ID (edit mode)
  if (editingId && existing) {
    existing.systolic = sbp; existing.diastolic = dbp;
    existing.meanArterial = Math.round((sbp + dbp * 2) / 3);
    existing.memo = memo; existing.updatedAt = new Date().toISOString();
    await putReading(existing);
    toast(`${date} のデータを更新しました`);
  } else {
    await putReading({
      patientId: currentPatientId, date, systolic: sbp, diastolic: dbp,
      meanArterial: Math.round((sbp + dbp * 2) / 3),
      note: memo, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString()
    });
    toast(`${date} のデータを登録しました`);
  }

  // Auto-advance to next day
  const d = new Date(date + 'T00:00:00');
  d.setDate(d.getDate() + 1);
  $('inp-date').value = formatDate(d);
  $('inp-sbp').value = '';
  $('inp-dbp').value = '';
  $('inp-memo').value = '';
  editingId = null;
  $('register-status').textContent = '';
  $('inp-sbp').focus();
  renderSummary();
  renderDailyList();
  renderGraphAndLegend();
  updateDataStat();
}

// ── Edit ──
async function editReading(id) {
  const readings = await getReadingsByPatient(currentPatientId);
  const r = readings.find(x => x.id === id);
  if (!r) return;
  editingId = id;
  $('inp-date').value = r.date;
  $('inp-sbp').value = r.systolic;
  $('inp-dbp').value = r.diastolic;
  $('inp-memo').value = r.note || '';
  $('register-status').textContent = '📝 編集中';
  $('inp-sbp').focus();
  $('inp-sbp').select();
  $('inp-sbp').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function deleteReadingConfirm(id) {
  confirm('削除確認', 'この測定データを削除しますか？', async () => {
    await deleteReading(id);
    toast('データを削除しました');
    renderPatientPage();
  });
}

// ═══════════════════════════════════════════════════════════
//  DATA MANAGEMENT

// CSV Export
$('btn-export-csv').addEventListener('click', async () => {
  const readings = await getReadingsByPatient(currentPatientId);
  const patient = await getPatient(currentPatientId);
  if (readings.length === 0) { toast('データがありません'); return; }
  readings.sort((a, b) => a.date.localeCompare(b.date));
  let csv = '\ufeff患者ID,患者氏名,測定日,収縮期,拡張期,平均血圧,メモ\n';
  readings.forEach(r => {
    const avg = Math.round((r.systolic + r.diastolic * 2) / 3);
    const name = patient ? patient.name.replace(/"/g, '""') : '';
    csv += `${currentPatientId},"${name}",${r.date},${r.systolic},${r.diastolic},${avg},"${(r.note || '').replace(/"/g, '""')}"\n`;
  });
  downloadFile(csv, `bp_${currentPatientId}_${currentYear}${String(currentMonth).padStart(2,'0')}.csv`);
  toast('CSVエクスポート完了');
});

// CSV Import
$('btn-import-csv').addEventListener('click', () => {
  $('file-import').value = '';
  $('file-import').accept = '.csv';
  $('file-import').onchange = async (e) => {
    const file = e.target.files[0]; if (!file) return;
    const text = await file.text();
    const records = parseCSV(text);
    if (records.length === 0) { toast('CSVデータがありません'); return; }
    let imported = 0, skipped = 0;
    for (const rec of records) {
      try {
        const existing = await getReadingByDate(rec.patientId, rec.date);
        if (existing) {
          existing.systolic = rec.systolic; existing.diastolic = rec.diastolic;
          existing.meanArterial = Math.round((rec.systolic + rec.diastolic * 2) / 3);
          existing.note = rec.note; existing.updatedAt = new Date().toISOString();
          await putReading(existing);
        } else {
          let pat = await getPatient(rec.patientId);
          if (!pat) await putPatient({ id: rec.patientId, name: rec.name, createdAt: new Date().toISOString() });
          await putReading({
            patientId: rec.patientId, date: rec.date,
            systolic: rec.systolic, diastolic: rec.diastolic,
            meanArterial: Math.round((rec.systolic + rec.diastolic * 2) / 3),
            note: rec.note, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString()
          });
        }
        imported++;
      } catch { skipped++; }
    }
    toast(`CSV取り込み完了: ${imported}件, ${skipped}件スキップ`);
    if (currentPatientId) renderPatientPage();
  };
  $('file-import').click();
});

// JSON Backup
$('btn-backup').addEventListener('click', async () => {
  const patients = await getAllPatients();
  const readings = await getAllReadings();
  const json = backupToJSON({ patients, readings });
  downloadFile(json, `bp_backup_${formatDate(new Date())}.json`, 'application/json');
  toast('バックアップ完了');
});

// JSON Restore
$('btn-restore').addEventListener('click', () => {
  $('file-import').value = '';
  $('file-import').accept = '.json';
  $('file-import').onchange = async (e) => {
    const file = e.target.files[0]; if (!file) return;
    try {
      const text = await file.text();
      const data = parseBackupJSON(text);
      if (!data) { toast('無効なバックアップファイル'); return; }
      confirm('復元確認', '全データをバックアップから復元します。既存データは上書きされます。', async () => {
        if (data.patients) for (const p of data.patients) await putPatient(p);
        if (data.readings) for (const r of data.readings) await putReading(r);
        toast('復元完了');
        currentPatientId = null;
        showScreen('id');
        $('inp-patient-id').value = '';
        $('inp-patient-id').focus();
        await renderRecentPatients();
      });
    } catch { toast('復元に失敗しました'); }
  };
  $('file-import').click();
});

// Delete Patient
$('btn-delete-patient').addEventListener('click', () => {
  confirm('患者削除', `患者 ${currentPatientId} の全データを削除します。本当によろしいですか？`, async () => {
    await deletePatient(currentPatientId);
    toast('患者を削除しました');
    currentPatientId = null;
    showScreen('id');
    $('inp-patient-id').value = '';
    await renderRecentPatients();
    $('inp-patient-id').focus();
  });
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.id === 'inp-memo') { e.preventDefault(); registerReading(); }
});

// ── Window resize ──
window.addEventListener('resize', () => {
  if (currentPatientId) renderGraphAndLegend();
});
